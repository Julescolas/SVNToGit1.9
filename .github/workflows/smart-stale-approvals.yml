# .github/workflows/smart-stale-approvals.yml
name: Smart stale approvals

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  smart-stale-approvals:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute current PR diff hash
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA"
          # Hash of the reviewable surface: added/removed content only, per file,
          # plus mode changes and binary patch bodies. Deliberately strips
          # "index <sha>..<sha>" lines and "@@ ... @@" hunk headers (line numbers
          # + funcname context) because both are affected by unrelated content
          # elsewhere in the same file - e.g. a sibling PR editing a different
          # section of the same file and merging first would otherwise change
          # this hash on the next base-sync even though nothing in this PR's own
          # diff changed. "old mode"/"new mode" lines are captured explicitly
          # since a chmod-only change (e.g. making a script executable) carries
          # no +/- lines and would otherwise be silently invisible to the hash.
          # "GIT binary patch" blocks are captured in full (everything up to the
          # next "diff --git") since binary content changes carry no +/- lines
          # either - without this, modifying an already-diffed binary file (e.g.
          # an image updated after review feedback) would not dismiss approvals.
          # Known limitation: detected renames aren't meaningfully captured by
          # this filter.
          HASH=$(git diff --binary "$BASE_SHA"...HEAD | awk '
            /^diff --git / { inbinary=0; print; next }
            /^(old mode|new mode) / { print; next }
            /^GIT binary patch$/ { inbinary=1; print; next }
            inbinary { print; next }
            /^[+-]/ && !/^(\+\+\+ |--- )/ { print; next }
          ' | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Current PR diff hash: $HASH"

      - name: Dismiss stale approvals if diff changed
        uses: actions/github-script@v7
        env:
          CURRENT_HASH: ${{ steps.diff.outputs.hash }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const currentHash = process.env.CURRENT_HASH;
            const marker = '<!-- smart-stale-approvals-hash:';

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner, repo, pull_number: pr, per_page: 100
            });

            // Latest APPROVED review per user (ignore dismissed/commented)
            const latestByUser = new Map();
            for (const r of reviews) {
              if (!r.user) continue;
              latestByUser.set(r.user.login, r);
            }
            const approvals = [...latestByUser.values()].filter(r => r.state === 'APPROVED');

            // Read last stored hash from bot comments
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr, per_page: 100
            });
            const botComments = comments
              .filter(c => c.body && c.body.includes(marker))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let previousHash = null;
            if (botComments.length) {
              const m = botComments[0].body.match(/smart-stale-approvals-hash:\s*([a-f0-9]+)/);
              previousHash = m ? m[1] : null;
            }

            async function recordHash(message) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr,
                body: [
                  '### Smart stale approvals',
                  '',
                  message,
                  '',
                  `${marker} ${currentHash} -->`
                ].join('\n')
              });
            }

            // No prior baseline: record current hash so future runs have something to compare against.
            if (!previousHash) {
              await recordHash('Baseline diff recorded for current approvals.');
              core.info(`Baseline recorded: ${currentHash}`);
              return;
            }

            if (previousHash === currentHash) {
              core.info('PR diff unchanged vs last baseline — keeping approvals.');
              return;
            }

            // Diff changed since the last recorded baseline.
            if (approvals.length === 0) {
              core.info('Diff changed but no active approvals to dismiss — updating baseline.');
              await recordHash('Diff changed since the last recorded baseline. No active approvals to dismiss right now; baseline updated so a future approval is compared against the current diff, not a stale one.');
              return;
            }

            core.warning(`Diff changed (${previousHash} → ${currentHash}) — dismissing approvals.`);

            for (const approval of approvals) {
              await github.rest.pulls.dismissReview({
                owner, repo, pull_number: pr,
                review_id: approval.id,
                message: 'Dismissed: the PR diff changed since this approval (smart-stale-approvals).'
              });
            }

            await recordHash('Approvals dismissed because the **PR diff vs base** changed.\nA sync/rebase that does not alter the reviewed diff would have kept them.');
